name: Build GamepadBridge APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build GamepadBridge APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: |
          mkdir -p /tmp/gamepadbridge-source
          tar -xJf source/GamepadBridge-source.tar.xz -C /tmp/gamepadbridge-source
          cp -a /tmp/gamepadbridge-source/GamepadBridge/. .

      - name: Apply GamepadBridge v0.4 updates
        run: |
          cp -a patches/v0.2/. .
          cp -a patches/v0.3/. .
          cp -a patches/v0.4/. .
          cp -a patches/v0.5/. .
          mkdir -p app/src/main/res/drawable-nodpi
          curl -L --fail --retry 3 -A 'GamepadBridge build' 'https://upload.wikimedia.org/wikipedia/commons/f/f0/Xbox-360-Wireless-Controller-White.png' -o app/src/main/res/drawable-nodpi/xbox360_white.png

      - name: Fix MappingScreen collection rendering
        run: |
          sed -i 's/collected.entries.takeLast(5)/collected.entries.toList().takeLast(5)/' app/src/main/java/com/gamepadbridge/app/ui/MappingScreen.kt

      - name: Verify v0.5 sources are the build inputs
        run: |
          grep -q 'versionName = "v0.5"' app/build.gradle.kts
          grep -q 'Gerenciar perfis' app/src/main/java/com/gamepadbridge/app/MainActivity.kt
          grep -q 'Criar perfil e mapear' app/src/main/java/com/gamepadbridge/app/MainActivity.kt
          grep -q 'profiles_v2' app/src/main/java/com/gamepadbridge/app/data/ProfileStore.kt
          grep -q 'Anterior' app/src/main/java/com/gamepadbridge/app/ui/MappingScreen.kt

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Configure stable debug signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode patches/v0.4/debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK package and version
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          test -n "$AAPT"
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk | tee /tmp/apk-badging.txt
          grep -q "package: name='com.gamepadbridge.app' versionCode='5' versionName='v0.5'" /tmp/apk-badging.txt
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GamepadBridge-v0.5
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
