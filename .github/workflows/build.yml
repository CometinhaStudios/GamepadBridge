name: Build GamepadBridge APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build GamepadBridge v1.6
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Extract verified Beta 2 baseline
        run: |
          mkdir -p /tmp/gamepadbridge-source
          tar -xJf source/GamepadBridge-source.tar.xz -C /tmp/gamepadbridge-source
          cp -a /tmp/gamepadbridge-source/GamepadBridge/. .
      - name: Apply corrected v1.0 implementation
        run: |
          base64 --decode patches/beta1/patch.tar.gz.b64 > /tmp/gamepadbridge-beta1.tar.gz
          tar -xzf /tmp/gamepadbridge-beta1.tar.gz -C /tmp
          cp -a /tmp/beta1_patch/. .
      - name: Apply Beta 2 controller visual and calibration safety fixes
        run: |
          base64 --decode patches/beta2/patch.tar.gz.b64 > /tmp/gamepadbridge-beta2.tar.gz
          tar -xzf /tmp/gamepadbridge-beta2.tar.gz -C /tmp
          cp -a /tmp/beta2_patch/. .
          bash scripts/apply-beta2.sh
      - name: Apply angled controller visual and live test feedback
        run: |
          cp -a patches/fix-v13/. .
      - name: Apply directional analog calibration and multi-direction axis bridge
        run: |
          python3 scripts/apply-v14.py
          cp -a patches/fix-v14/. .
      - name: Add native virtual Xbox 360 controller through Shizuku UInput
        run: |
          python3 scripts/apply-uinput.py
      - name: Set up Android SDK, NDK and CMake
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.2.12479018 cmake;3.22.1'
      - name: Block external controller keys from Android navigation during mapping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/gamepadbridge/app/MainActivity.kt")
          s = p.read_text()
          marker = "        // GamepadBridge: external controller keys are captured from /dev/input during mapping."
          if marker not in s:
              needle = "    override fun dispatchKeyEvent(event: KeyEvent): Boolean {"
              if needle not in s:
                  raise SystemExit("dispatchKeyEvent not found; refusing to build without the mapping safety guard.")
              guard = """    override fun dispatchKeyEvent(event: KeyEvent): Boolean {
                  // GamepadBridge: external controller keys are captured from /dev/input during mapping.
                  // Some pads report ordinary buttons as BACK/MODE or with a keyboard source.
                  val controllerSources = InputDevice.SOURCE_GAMEPAD or InputDevice.SOURCE_JOYSTICK or InputDevice.SOURCE_DPAD
                  val eventDevice = InputDevice.getDevice(event.deviceId)
                  val isExternalController = event.deviceId > 0 && (
                      (event.source and controllerSources) != 0 ||
                      ((eventDevice?.sources ?: 0) and controllerSources) != 0 ||
                      event.keyCode == KeyEvent.KEYCODE_BACK
                  )
                  if (mappingActive && isExternalController) return true
          """
              s = s.replace(needle, guard, 1)
              p.write_text(s)
          PY
      - name: Set app version
        run: |
          sed -i 's/versionCode = 1/versionCode = 9/' app/build.gradle.kts
          sed -i 's/versionName = "0.1"/versionName = "v1.6"/' app/build.gradle.kts
          grep -q 'versionCode = 9' app/build.gradle.kts
          grep -q 'versionName = "v1.6"' app/build.gradle.kts
      - name: Configure persistent debug signing
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode signing/gamepadbridge-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Build APK
        run: gradle assembleDebug --stacktrace
      - name: Verify generated APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "package: name='com.gamepadbridge.app'" /tmp/apk-badging.txt
          sha256sum "$APK"
      - name: Upload v1.6 APK
        uses: actions/upload-artifact@v4
        with:
          name: GamepadBridge-v1.6
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
