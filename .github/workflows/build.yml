name: Build GamepadBridge APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build GamepadBridge v1.8 (analog capture fix)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Extract verified Beta 2 baseline
        run: |
          mkdir -p /tmp/gamepadbridge-source
          tar -xJf source/GamepadBridge-source.tar.xz -C /tmp/gamepadbridge-source
          cp -a /tmp/gamepadbridge-source/GamepadBridge/. .
      - name: Apply corrected v1.0 implementation
        run: |
          base64 --decode patches/beta1/patch.tar.gz.b64 > /tmp/gamepadbridge-beta1.tar.gz
          tar -xzf /tmp/gamepadbridge-beta1.tar.gz -C /tmp
          cp -a /tmp/beta1_patch/. .
      - name: Apply Beta 2 controller visual and calibration safety fixes
        run: |
          base64 --decode patches/beta2/patch.tar.gz.b64 > /tmp/gamepadbridge-beta2.tar.gz
          tar -xzf /tmp/gamepadbridge-beta2.tar.gz -C /tmp
          cp -a /tmp/beta2_patch/. .
          bash scripts/apply-beta2.sh
      - name: Apply angled controller visual and live test feedback
        run: |
          cp -a patches/fix-v13/. .
      - name: Apply directional analog calibration and multi-direction axis bridge
        run: |
          python3 scripts/apply-v14.py
          cp -a patches/fix-v14/. .
      - name: Add native virtual Xbox 360 controller through Shizuku UInput
        run: |
          python3 scripts/apply-uinput.py
      - name: Set up Android SDK, NDK and CMake
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.2.12479018 cmake;3.22.1'
      - name: Fix analog capture using the kernel's real neutral axis values
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/gamepadbridge/app/input/DeviceNodeReader.kt")
          s = p.read_text()
          old = "data class AxisRange(val min: Int, val max: Int) {"
          new = "data class AxisRange(val min: Int, val max: Int, val current: Int) {"
          assert old in s, "AxisRange declaration mismatch"
          s = s.replace(old, new, 1)
          old = r'val regex = Regex("""(ABS_[A-Z0-9_]+)\s*:\s*value\s+-?\d+,\s*min\s+(-?\d+),\s*max\s+(-?\d+)""")'
          new = r'val regex = Regex("""(ABS_[A-Z0-9_]+)\s*:\s*value\s+(-?\d+),\s*min\s+(-?\d+),\s*max\s+(-?\d+)""")'
          assert old in s, "Axis regex mismatch"
          s = s.replace(old, new, 1)
          old = """            val min = match.groupValues[2].toIntOrNull() ?: return@forEach
                      val max = match.groupValues[3].toIntOrNull() ?: return@forEach
                      if (max > min) result[match.groupValues[1]] = AxisRange(min, max)"""
          new = """            val current = match.groupValues[2].toIntOrNull() ?: return@forEach
                      val min = match.groupValues[3].toIntOrNull() ?: return@forEach
                      val max = match.groupValues[4].toIntOrNull() ?: return@forEach
                      if (max > min) result[match.groupValues[1]] = AxisRange(min, max, current)"""
          assert old in s, "Axis parser body mismatch"
          p.write_text(s.replace(old, new, 1))

          p = Path("app/src/main/java/com/gamepadbridge/app/input/CalibrationCapture.kt")
          s = p.read_text()
          old = """        val token = generation.incrementAndGet()
                  synchronized(axisRestValue) { axisRestValue.clear() }
                  thread(name = "calibration-capture") {"""
          new = """        val token = generation.incrementAndGet()
                  val initialRanges = DeviceNodeReader.getAxisRanges(node)
                  synchronized(axisRestValue) {
                      axisRestValue.clear()
                      initialRanges.forEach { (code, range) -> axisRestValue[code] = range.current }
                  }
                  thread(name = "calibration-capture") {"""
          assert old in s, "Calibration start block mismatch"
          s = s.replace(old, new, 1)
          old = """                            val rest = synchronized(axisRestValue) {
                                              axisRestValue.getOrPut(line.code) { raw }
                                          }
                                          if (abs(raw.toLong() - rest.toLong()) > 45L) {"""
          new = """                            val range = initialRanges[line.code]
                                          val rest = synchronized(axisRestValue) {
                                              axisRestValue.getOrPut(line.code) { range?.current ?: raw }
                                          }
                                          val threshold = range?.let {
                                              maxOf(2L, (it.max.toLong() - it.min.toLong()) / 16L)
                                          } ?: 45L
                                          if (abs(raw.toLong() - rest.toLong()) > threshold) {"""
          assert old in s, "Calibration threshold block mismatch"
          p.write_text(s.replace(old, new, 1))
          PY
          grep -q 'val current: Int' app/src/main/java/com/gamepadbridge/app/input/DeviceNodeReader.kt
          grep -q 'initialRanges.forEach' app/src/main/java/com/gamepadbridge/app/input/CalibrationCapture.kt
          grep -q 'val threshold = range?.let' app/src/main/java/com/gamepadbridge/app/input/CalibrationCapture.kt
      - name: Set app version
        run: |
          sed -i 's/versionCode = 1/versionCode = 11/' app/build.gradle.kts
          sed -i 's/versionName = "0.1"/versionName = "v1.8"/' app/build.gradle.kts
          grep -q 'versionCode = 11' app/build.gradle.kts
          grep -q 'versionName = "v1.8"' app/build.gradle.kts
      - name: Configure persistent debug signing
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode signing/gamepadbridge-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Build APK
        run: gradle assembleDebug --stacktrace
      - name: Verify generated APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "package: name='com.gamepadbridge.app'" /tmp/apk-badging.txt
          sha256sum "$APK"
      - name: Upload v1.8 APK
        uses: actions/upload-artifact@v4
        with:
          name: GamepadBridge-v1.8
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
