name: Build GamepadBridge APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build GamepadBridge v1.16 (clean consolidated source)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore consolidated application source
        run: |
          test -s source/GamepadBridge-clean-source.tar.xz
          mkdir -p /tmp/gamepadbridge-clean
          tar -xJf source/GamepadBridge-clean-source.tar.xz -C /tmp/gamepadbridge-clean
          test -d /tmp/gamepadbridge-clean/GamepadBridge/app/src/main
          cp -a /tmp/gamepadbridge-clean/GamepadBridge/. .
          test -f app/src/main/AndroidManifest.xml
          echo "Consolidated source restored; legacy patch scripts will not run."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set app version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          s, code_count = re.subn(r'versionCode\s*=\s*\d+', 'versionCode = 19', s, count=1)
          s, name_count = re.subn(r'versionName\s*=\s*"[^"]+"', 'versionName = "v1.16"', s, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not safely set app version")
          p.write_text(s)
          PY
          grep -q 'versionCode = 19' app/build.gradle.kts
          grep -q 'versionName = "v1.16"' app/build.gradle.kts

      - name: Configure persistent debug signing
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode signing/gamepadbridge-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          test -s "$HOME/.android/debug.keystore"

      - name: Run unit tests and build APK
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Verify generated APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "package: name='com.gamepadbridge.app' versionCode='19' versionName='v1.16'" /tmp/apk-badging.txt
          sha256sum "$APK"

      - name: Upload v1.16 APK
        uses: actions/upload-artifact@v4
        with:
          name: GamepadBridge-v1.16
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
