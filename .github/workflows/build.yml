name: Build GamepadBridge APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build GamepadBridge from Beta 2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Extract verified Beta 2 source
        run: |
          mkdir -p /tmp/gamepadbridge-source
          tar -xJf source/GamepadBridge-source.tar.xz -C /tmp/gamepadbridge-source
          cp -a /tmp/gamepadbridge-source/GamepadBridge/. .
      - name: Apply Beta 2 compile compatibility fix
        run: |
          sed -i 's/collected.entries.takeLast(5)/collected.entries.toList().takeLast(5)/' app/src/main/java/com/gamepadbridge/app/ui/MappingScreen.kt
      - name: Set version
        run: |
          sed -i 's/versionCode = 1/versionCode = 2/' app/build.gradle.kts
          sed -i 's/versionName = "0.1"/versionName = "Beta 2.1"/' app/build.gradle.kts
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Verify APK package and version
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          test -n "$AAPT"
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk | tee /tmp/apk-badging.txt
          grep -q "package: name='com.gamepadbridge.app' versionCode='2' versionName='Beta 2.1'" /tmp/apk-badging.txt
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GamepadBridge-beta2.1
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
