name: Build GamepadBridge APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Beta 1 APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: |
          mkdir -p /tmp/gamepadbridge-source
          tar -xJf source/GamepadBridge-source.tar.xz -C /tmp/gamepadbridge-source
          cp -a /tmp/gamepadbridge-source/GamepadBridge/. .

      - name: Fix Shizuku process access and Kotlin read loop
        run: |
          cat > app/src/main/java/com/gamepadbridge/app/input/DeviceNodeReader.kt <<'KOTLIN'
          package com.gamepadbridge.app.input

          import rikka.shizuku.Shizuku
          import java.io.BufferedReader
          import java.io.InputStreamReader

          object DeviceNodeReader {
              data class RawLine(val type: String, val code: String, val value: String)
              data class DeviceEntry(val node: String, val name: String)

              fun listDevices(): List<DeviceEntry> {
                  val output = runShell("getevent -il") ?: return emptyList()
                  val result = mutableListOf<DeviceEntry>()
                  var currentNode: String? = null
                  for (line in output.lines()) {
                      val nodeMatch = Regex("""add device \\d+: (/dev/input/event\\d+)""").find(line)
                      if (nodeMatch != null) currentNode = nodeMatch.groupValues[1]
                      val nameMatch = Regex("""name:\\s*"(.*)"""").find(line)
                      if (nameMatch != null && currentNode != null) {
                          result.add(DeviceEntry(currentNode, nameMatch.groupValues[1]))
                      }
                  }
                  return result
              }

              fun streamEvents(node: String, onLine: (RawLine) -> Unit, shouldStop: () -> Boolean) {
                  val process = runShizukuCommand(arrayOf("getevent", "-l", node)) ?: return
                  val reader = BufferedReader(InputStreamReader(process.inputStream))
                  try {
                      while (!shouldStop()) {
                          val line = reader.readLine() ?: break
                          val parsed = parseLine(line) ?: continue
                          onLine(parsed)
                      }
                  } finally {
                      runCatching { process.destroy() }
                  }
              }

              private fun parseLine(line: String): RawLine? {
                  val parts = line.trim().split(Regex("\\s+"))
                  if (parts.size < 3) return null
                  val type = parts[parts.size - 3]
                  val code = parts[parts.size - 2]
                  val value = parts[parts.size - 1]
                  if (!type.startsWith("EV_")) return null
                  return RawLine(type, code, value)
              }

              private fun runShell(cmd: String): String? {
                  return runCatching {
                      val process = runShizukuCommand(cmd.split(" ").toTypedArray()) ?: return null
                      process.inputStream.bufferedReader().use { it.readText() }
                  }.getOrNull()
              }

              // Shizuku exposes newProcess as non-public in some API versions.
              private fun runShizukuCommand(command: Array<String>): Process? {
                  return runCatching {
                      val method = Shizuku::class.java.declaredMethods.firstOrNull {
                          it.name == "newProcess" && it.parameterTypes.size == 3
                      } ?: return null
                      method.isAccessible = true
                      method.invoke(null, command, null, null) as? Process
                  }.getOrNull()
              }
          }
          KOTLIN

      - name: Refresh Shizuku detection in app UI
        run: |
          cat > app/src/main/java/com/gamepadbridge/app/MainActivity.kt <<'KOTLIN'
          package com.gamepadbridge.app

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp
          import androidx.navigation.compose.NavHost
          import androidx.navigation.compose.composable
          import androidx.navigation.compose.rememberNavController
          import com.gamepadbridge.app.data.ProfileStore
          import com.gamepadbridge.app.inject.ShizukuBridge
          import com.gamepadbridge.app.service.GamepadBridgeService
          import com.gamepadbridge.app.ui.MappingScreen
          import rikka.shizuku.Shizuku

          class MainActivity : ComponentActivity() {
              private var shizukuAvailable by mutableStateOf(false)
              private var shizukuPermission by mutableStateOf(false)

              private val permissionListener = Shizuku.OnRequestPermissionResultListener { _, grantResult ->
                  refreshShizukuState()
                  if (grantResult == android.content.pm.PackageManager.PERMISSION_GRANTED) ShizukuBridge.bind(this)
              }

              private fun refreshShizukuState() {
                  val available = ShizukuBridge.isAvailable
                  shizukuAvailable = available
                  shizukuPermission = available && ShizukuBridge.hasPermission
                  if (shizukuPermission) ShizukuBridge.bind(this)
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  Shizuku.addRequestPermissionResultListener(permissionListener)
                  refreshShizukuState()
                  setContent {
                      MaterialTheme {
                          val navController = rememberNavController()
                          val profileStore = remember { ProfileStore(applicationContext) }
                          val profile by profileStore.profileFlow.collectAsState(initial = null)
                          NavHost(navController, startDestination = "home") {
                              composable("home") {
                                  HomeScreen(
                                      hasProfile = profile != null,
                                      shizukuAvailable = shizukuAvailable,
                                      shizukuPermission = shizukuPermission,
                                      onRefreshShizuku = { refreshShizukuState() },
                                      onRequestShizukuPermission = { ShizukuBridge.requestPermission() },
                                      onMap = { navController.navigate("mapping") },
                                      onToggleService = { starting ->
                                          if (starting) GamepadBridgeService.start(this@MainActivity)
                                          else GamepadBridgeService.stop(this@MainActivity)
                                      }
                                  )
                              }
                              composable("mapping") {
                                  MappingScreen(profileStore = profileStore) { navController.popBackStack() }
                              }
                          }
                      }
                  }
              }

              override fun onResume() {
                  super.onResume()
                  refreshShizukuState()
              }

              override fun onDestroy() {
                  Shizuku.removeRequestPermissionResultListener(permissionListener)
                  super.onDestroy()
              }
          }

          @Composable
          fun HomeScreen(
              hasProfile: Boolean,
              shizukuAvailable: Boolean,
              shizukuPermission: Boolean,
              onRefreshShizuku: () -> Unit,
              onRequestShizukuPermission: () -> Unit,
              onMap: () -> Unit,
              onToggleService: (Boolean) -> Unit
          ) {
              var serviceRunning by remember { mutableStateOf(false) }
              Column(
                  Modifier.fillMaxSize().padding(24.dp),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.Center
              ) {
                  Text("Gamepad Bridge", style = MaterialTheme.typography.headlineMedium)
                  Spacer(Modifier.height(8.dp))
                  Text(
                      "Transforma seu controle genérico (OTG) em um Xbox Controller reconhecido pelos jogos do Android.",
                      style = MaterialTheme.typography.bodyMedium
                  )
                  Spacer(Modifier.height(32.dp))
                  when {
                      !shizukuAvailable -> {
                          Text("Serviço Shizuku indisponível. Abra o Shizuku, inicie o serviço e volte aqui.")
                          Spacer(Modifier.height(12.dp))
                          OutlinedButton(onClick = onRefreshShizuku, modifier = Modifier.fillMaxWidth()) {
                              Text("Verificar Shizuku novamente")
                          }
                      }
                      !shizukuPermission -> {
                          Text("Shizuku conectado. Falta autorizar o Gamepad Bridge.")
                          Spacer(Modifier.height(12.dp))
                          Button(onClick = onRequestShizukuPermission, modifier = Modifier.fillMaxWidth()) {
                              Text("Conceder acesso ao Shizuku")
                          }
                          TextButton(onClick = onRefreshShizuku) { Text("Verificar permissão") }
                      }
                      else -> {
                          Text("Shizuku conectado e autorizado.", color = MaterialTheme.colorScheme.primary)
                          Spacer(Modifier.height(16.dp))
                          Button(onClick = onMap, modifier = Modifier.fillMaxWidth()) {
                              Text(if (hasProfile) "Remapear controle" else "Mapear controle")
                          }
                          Spacer(Modifier.height(16.dp))
                          Button(
                              onClick = {
                                  serviceRunning = !serviceRunning
                                  onToggleService(serviceRunning)
                              },
                              enabled = hasProfile,
                              modifier = Modifier.fillMaxWidth()
                          ) { Text(if (serviceRunning) "Parar ponte" else "Iniciar ponte") }
                          if (!hasProfile) {
                              Spacer(Modifier.height(8.dp))
                              Text("Mapeie o controle primeiro.", style = MaterialTheme.typography.bodySmall)
                          }
                          TextButton(onClick = onRefreshShizuku) { Text("Atualizar conexão") }
                      }
                  }
              }
          }
          KOTLIN

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GamepadBridge-beta1
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
