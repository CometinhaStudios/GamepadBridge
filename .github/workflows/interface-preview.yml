name: Build isolated GamepadBridge interface preview

on:
  push:
    branches: [interface-preview]
    paths:
      - '.github/workflows/interface-preview.yml'
      - 'source/**'
      - 'patches/fix-v13/**'
      - 'interface/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore stable app source into isolated build workspace
        run: |
          set -euo pipefail
          test -s source/GamepadBridge-clean-source.tar.xz
          mkdir -p /tmp/gpb-preview
          tar -xJf source/GamepadBridge-clean-source.tar.xz -C /tmp/gpb-preview
          test -d /tmp/gpb-preview/GamepadBridge/app/src/main
          cp -a /tmp/gpb-preview/GamepadBridge/. .
          test -f app/src/main/java/com/gamepadbridge/app/MainActivity.kt

      - name: Turn this build into a standalone controller-test preview
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          main = Path("app/src/main/java/com/gamepadbridge/app/MainActivity.kt")
          s = main.read_text()
          old = '''    override fun dispatchKeyEvent(event: KeyEvent): Boolean {
                  if (mappingScreenActive && event.keyCode != KeyEvent.KEYCODE_BACK && event.device != null && !event.device.isVirtual) return true
                  return super.dispatchKeyEvent(event)
              }
              override fun dispatchGenericMotionEvent(event: MotionEvent): Boolean {
                  return super.dispatchGenericMotionEvent(event)
              }'''
          new = '''    override fun dispatchKeyEvent(event: KeyEvent): Boolean {
                  if (ControllerTestState.enabled && event.keyCode != KeyEvent.KEYCODE_BACK &&
                      event.device != null && !event.device.isVirtual) {
                      if (event.action == KeyEvent.ACTION_DOWN || event.action == KeyEvent.ACTION_UP) {
                          ControllerTestState.key(event.keyCode, event.action == KeyEvent.ACTION_DOWN)
                          return true
                      }
                  }
                  if (mappingScreenActive && event.keyCode != KeyEvent.KEYCODE_BACK && event.device != null && !event.device.isVirtual) return true
                  return super.dispatchKeyEvent(event)
              }

              override fun dispatchGenericMotionEvent(event: MotionEvent): Boolean {
                  if (ControllerTestState.enabled && event.action == MotionEvent.ACTION_MOVE &&
                      event.isFromSource(InputDevice.SOURCE_JOYSTICK)) {
                      val lx = event.getAxisValue(MotionEvent.AXIS_X)
                      val ly = event.getAxisValue(MotionEvent.AXIS_Y)
                      val rx = event.getAxisValue(MotionEvent.AXIS_RX)
                      val ry = event.getAxisValue(MotionEvent.AXIS_RY)
                      fun trigger(axis: Int, fallback: Int): Float {
                          val primary = event.getAxisValue(axis)
                          val value = if (primary != 0f) primary else event.getAxisValue(fallback)
                          return if (value < 0f) ((value + 1f) / 2f).coerceIn(0f, 1f) else value.coerceIn(0f, 1f)
                      }
                      ControllerTestState.axes(lx, ly, rx, ry,
                          trigger(MotionEvent.AXIS_LTRIGGER, MotionEvent.AXIS_BRAKE),
                          trigger(MotionEvent.AXIS_RTRIGGER, MotionEvent.AXIS_GAS))
                      return true
                  }
                  return super.dispatchGenericMotionEvent(event)
              }'''
          if old not in s:
              raise SystemExit("Could not find expected input-dispatch methods in MainActivity")
          s = s.replace(old, new, 1)
          s = s.replace('NavHost(navController, startDestination = "home")', 'NavHost(navController, startDestination = "test")', 1)
          main.write_text(s)

          gradle = Path("app/build.gradle.kts")
          g = gradle.read_text()
          g, n = re.subn(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "com.gamepadbridge.preview"', g, count=1)
          g, v = re.subn(r'versionCode\s*=\s*\d+', 'versionCode = 1', g, count=1)
          g, vn = re.subn(r'versionName\s*=\s*"[^"]+"', 'versionName = "Interface Preview"', g, count=1)
          if (n, v, vn) != (1, 1, 1):
              raise SystemExit("Could not isolate preview package/version")
          gradle.write_text(g)

          manifest = Path("app/src/main/AndroidManifest.xml")
          m = manifest.read_text().replace('android:label="Gamepad Bridge"', 'android:label="GamepadBridge UI Preview"')
          manifest.write_text(m)
          PY
          grep -q 'startDestination = "test"' app/src/main/java/com/gamepadbridge/app/MainActivity.kt
          grep -q 'applicationId = "com.gamepadbridge.preview"' app/build.gradle.kts
          grep -q 'ControllerTestState.axes(lx, ly, rx, ry' app/src/main/java/com/gamepadbridge/app/MainActivity.kt

      - name: Integrate Google Xbox 360 dashboard UI into isolated preview
        shell: bash
        run: |
          set -euo pipefail
          unzip -q interface/google-ui-source.zip -d /tmp/google-ui
          mkdir -p app/src/main/java/com/gamepadbridge/ui app/src/main/res/layout
          cp /tmp/google-ui/app/src/main/java/com/gamepadbridge/GamepadTestActivity.java app/src/main/java/com/gamepadbridge/GamepadTestActivity.java
          cp /tmp/google-ui/app/src/main/java/com/gamepadbridge/ui/Xbox360ControllerView.java app/src/main/java/com/gamepadbridge/ui/Xbox360ControllerView.java
          cp /tmp/google-ui/app/src/main/res/layout/activity_xbox_dashboard.xml app/src/main/res/layout/activity_xbox_dashboard.xml
          python3 - <<'PY'
          from pathlib import Path
          import re

          activity = Path("app/src/main/java/com/gamepadbridge/GamepadTestActivity.java")
          a = activity.read_text()
          a = a.replace("import androidx.appcompat.app.AppCompatActivity;", "import android.app.Activity;\nimport com.gamepadbridge.app.R;")
          a = a.replace("extends AppCompatActivity", "extends Activity")
          activity.write_text(a)

          view = Path("app/src/main/java/com/gamepadbridge/ui/Xbox360ControllerView.java")
          v = view.read_text().replace("import androidx.annotation.Nullable;", "")
          v = v.replace("(@Nullable AttributeSet attrs)", "(AttributeSet attrs)")
          view.write_text(v)

          layout = Path("app/src/main/res/layout/activity_xbox_dashboard.xml")
          x = layout.read_text()
          x = x.replace('            android:spacing="16dp"\n', "")
          x = x.replace('android:text="Shizuku: Conectado"', 'android:text="PRÉVIA VISUAL"')
          layout.write_text(x)

          manifest = Path("app/src/main/AndroidManifest.xml")
          m = manifest.read_text()
          pattern = r'<activity\b(?=[^>]*android:name="[^"]*MainActivity")[\s\S]*?</activity>'
          def strip_launcher(match):
              block = re.sub(r'<intent-filter>[\s\S]*?</intent-filter>', '', match.group(0), count=1)
              return block
          m, count = re.subn(pattern, strip_launcher, m, count=1)
          if count != 1:
              raise SystemExit("Could not find MainActivity declaration in AndroidManifest.xml")
          new_activity = """<activity android:name="com.gamepadbridge.GamepadTestActivity" android:exported="true" android:screenOrientation="portrait">
              <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
              </intent-filter>
          </activity>"""
          m = m.replace("</application>", new_activity + "\n    </application>")
          manifest.write_text(m)
          PY
          test -s app/src/main/java/com/gamepadbridge/GamepadTestActivity.java
          test -s app/src/main/java/com/gamepadbridge/ui/Xbox360ControllerView.java
          grep -q 'com.gamepadbridge.GamepadTestActivity' app/src/main/AndroidManifest.xml
          grep -q 'PRÉVIA VISUAL' app/src/main/res/layout/activity_xbox_dashboard.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK and native build tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install NDK and CMake
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT" /usr/local/lib/android/sdk /opt/android-sdk -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build preview APK
        run: gradle assembleDebug --stacktrace

      - name: Verify preview APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n1)"
          "$AAPT" dump badging "$APK" | grep -E "package: name='com.gamepadbridge.preview'|application-label:'GamepadBridge UI Preview'"
          sha256sum "$APK"

      - name: Upload isolated preview APK
        uses: actions/upload-artifact@v4
        with:
          name: GamepadBridge-Interface-Preview
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
